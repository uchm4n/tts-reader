name: Build & Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            os: macos-latest
            package-type: dmg
          - platform: windows
            os: windows-latest
            package-type: nsis
          - platform: linux
            os: ubuntu-latest
            package-type: deb

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev libxdo-dev

      - uses: ealmloff/dioxus-ci/actions/setup-dioxus@main

      - uses: ealmloff/dioxus-ci/actions/install-dioxus-cli@main

      - name: Build & Bundle
        run: >
          dx bundle
          --package-types ${{ matrix.package-type }}
          --package tts-reader
          --release

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tts-reader-${{ matrix.platform }}
          path: target/dx/tts-reader/bundle/

  release:
    name: Create Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: artifacts/*
          generate_release_notes: true
