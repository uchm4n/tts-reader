[package]
name = "tts-reader"
version = "0.0.5"
edition = "2021"

[dependencies]
dioxus = { workspace = true, features = ["desktop"] }
dioxus-desktop = { workspace = true }
futures = "0.3"
kokoro-en = { version = "0.1.4", default-features = false }
ort-sys = { version = "2.0.0-rc.11", features = ["lax-feature-matching"] }
rodio = "0.20"
dotenvy = "0.15"
tokio = { version = "1", features = ["time", "rt-multi-thread"] }
ui = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
arboard = "3.6"
enigo = { version = "0.6", default-features = false, features = ["serde"] }
ort = { version = "2.0.0-rc.11", features = ["coreml"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
ort = { version = "2.0.0-rc.11" }

[features]
default = []
tts-tests = []
